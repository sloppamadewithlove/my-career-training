name: Windows checks and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      SDL_VIDEODRIVER: dummy
      PYTHONUTF8: '1'
      # Stable installers remain held pending verified native menus.
      # The owner separately authorized the 2026-10-24 native candidate prerelease.
      # Build and installation checks still run; this workflow uploads no artifacts while held.
      MCT_INSTALLER_HOLD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install exact locked environment
        run: |
          uv python install 3.12.13
          uv sync --python 3.12.13 --frozen --all-groups
      - name: Static checks and meaningful domain/adapter tests
        run: |
          uv run --frozen ruff check src tests scripts packaging
          uv run --frozen pytest -q
      - name: Download and verify pinned RLBot runtime
        run: uv run --frozen python scripts/fetch_runtime.py
      - name: Compile pinned AMD64 in-game plugin and inspect native exports
        run: uv run --frozen python scripts/build_plugin.py
      - name: Download and verify pinned local bot model
        run: uv run --frozen python scripts/fetch_bot_provider.py
      - name: Collect redistributed dependency notices
        run: uv run --frozen python scripts/collect_licenses.py
      - name: Build UI and console worker executables
        run: uv run --frozen pyinstaller --noconfirm --clean packaging/my-career-training.spec
      - name: Frozen package smoke tests
        run: uv run --frozen python scripts/smoke_package.py
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup compiler download checksum mismatch'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $installProcess = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compilerDir`"") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Inno Setup install failed: $($installProcess.ExitCode)" }
          "INNO_COMPILER=$compilerDir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $version = uv run --frozen python -c "import importlib.metadata; print(importlib.metadata.version('my-career-training'))"
          & $env:INNO_COMPILER "/DAppVersion=$version" 'packaging/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Installation, same-version reinstall and uninstall checks
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          uv run --frozen python scripts/test_installer.py $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer smoke test failed' }
      - name: Create portable archive and checksums
        run: uv run --frozen python scripts/package_release.py
      - name: Upload actual Windows artifacts
        if: env.MCT_INSTALLER_HOLD != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MyCareerTraining-windows-x64-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
