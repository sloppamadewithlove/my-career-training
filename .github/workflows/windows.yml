name: Windows checks and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  # Finish the active candidate; GitHub retains only the newest pending run.
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/native-candidate.yml
